[project]
name = "mt5-mcp-server"
version = "0.1.0"
description = "MCP Server for MetaTrader 5 integration"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "MetaTrader5>=5.0.45",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["mt5_mcp/tests", "tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
