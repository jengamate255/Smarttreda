[project]
name = "forex-ai-agent"
version = "0.1.0"
description = "Local + Google Colab Forex AI trading research platform (MT5 data, supervised ML, backtesting)"
requires-python = ">=3.11"
dependencies = [
    "MetaTrader5>=5.0.45",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "optuna>=3.6",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "PyYAML>=6.0",
    "torch>=2.2",
    "polars>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*is_sparse.*:FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
