; Supervisor configuration for MT5 Dashboard services
; Install: pip install supervisor
; Run: supervisord -c supervisor.conf
; Control: supervisorctl -c supervisor.conf

[unix_http_server]
file = logs/supervisor.sock
chmod = 0700

[supervisord]
logfile = logs/supervisord.log
logfile_maxbytes = 5MB
logfile_backups = 3
loglevel = info
pidfile = logs/supervisord.pid
nodaemon = false
minfds = 1024
minprocs = 200
user = Dave

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix://logs/supervisor.sock

[program:dashboard_prop]
command = C:\Users\Dave\AppData\Roaming\uv\python\cpython-3.11-windows-x86_64-none\python.exe web_dashboard.py --port 8051
directory = E:\Project\Mt5 Ea
environment = MT5_MCP_MT5_TERMINAL_PATH="C:\Program Files\MetaTrader 5 Terminal\terminal64.exe",MT5_MCP_MT5_LOGIN="11911448",MT5_MCP_MT5_PASSWORD="",MT5_MCP_MT5_SERVER="FundingPips2-SIM"
